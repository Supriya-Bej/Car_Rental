<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image upload</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body style="background-color: rgb(199, 199, 200);">


    <!-- Picture of Bike -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6">
                <div class="container text-center mb-3 ">
                    <div class="row">
                        <div class="col border border-dark bg-light" style="padding: 20vh;">
                            <!-- <img src="Assets/image/Cars/thar/thar.avif" class="img-fluid d-block page-picture" alt=""> -->
                            <i class="fa-solid fa-arrow-up-from-bracket"></i>
                        </div>
                    </div>
                    <div class="row mt-5">
                        <div class="col border border-dark bg-light py-2" style="height: 16vh;">
                            <!-- <img src="Assets/image/Cars/thar/thar6.avif" class="img-fluid w-75 h-75" alt=""> -->
                        </div>
                        <div class="col border border-dark bg-light" style="height: 16vh;">
                            <!-- <img src="Assets/image/Cars/thar/thar7.avif" class="img-fluid w-75 h-75" alt=""> -->
                        </div>
                        <div class="col border border-dark bg-light" style="height: 16vh;">
                            <!-- <img src="Assets/image/Cars/thar/thar5.avif" class="img-fluid w-75 h-75" alt=""> -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 book_section">
                <div class="card mb-5">
                    <form action="" class="booking_form">
                        <div class=" p-4">
                            <div>
                                <input type="text" placeholder="How Many Vehicle Do You Want To Share"
                                    class="w-100 p-2 form-control text-dark mt-3" name="" id="">
                                <br>
                                <input type="text" placeholder="Vehicle Name" class="w-100 p-2 form-control text-dark"
                                    name="" id="">
                                <br>
                                <div class="container text-center">
                                    <div class="row justify-content-evenly">
                                        <div class="col-6">
                                             <input type="text" placeholder="Vehicle Model"class="w-100 p-2 form-control text-dark" name="" id="">
                                        </div>
                                        <div class="col-6">
                                             <input type="text" placeholder="Vehicle Number"class="w-100 p-2 form-control text-dark" name="" id="">
                                        </div>
                                    </div>
                                </div>
                                <br>
                                <div class="container text-center">
                                    <div class="row justify-content-evenly">
                                        <div class="col-6">
                                             <input type="text" placeholder="Set Your Own Price"class="w-100 p-2 form-control text-dark" name="" id="">
                                        </div>
                                        <div class="col-6">
                                             <input type="text" placeholder="Zip Code"class="w-100 p-2 form-control text-dark" name="" id="">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-3">
                                <button class="w-100 rounded p-2 border-dark bg-dark text-danger mt-3 fw-bold">Done</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="Assets/js/bootstrap.bundle.min.js"></script>
</body>

</html>
