<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carete accout Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

    <!---------------------------- Main Container ------------------------->
    <div class="container d-flex justify-content-center align-items-center min-vh-99">

        <div class="row border rounded p-3 bg-light shadow box-area">

            <div class="col-md-6 rounded-4 d-flex justify-content-center align-items-center flex-column left_box insurance_container">

                <div class="content">
                    <!-- <div class="featured_image mb-3">
                        <img src="Assets/image/Bikes/Triumph/triumph.avif" alt="" class="img-fluid" style="width: 250px;">
                    </div> -->

                    <p class="text-light fs-2 fw-bold">Welcome to Drivee®</p>
                    <p class="text-light fs-6">The best global car sharing marketplace</p>
                    <small class="text-light text-wrap text-center" style="width: 17rem;">Have a car? Earn money as a host. Rent your dream car as a guest.</small>
                </div>

            </div>

            <div class="col-md-6 right_box ">
                <div class="row align-items-center">
                    <div class="header-text mb-3">
                        <h2 class="fw-bold mb-4">Drivee</h2>
                        <h5 class="mb-4">Craete an Account</h5>
                    </div>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control form-control-lg bg-light fs-6" placeholder="Enter your name">
                    </div>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control form-control-lg bg-light fs-6" placeholder="Enter your email">
                    </div>

                    <div class="input-group mb-1">
                        <input type="password" class="form-control form-control-lg bg-light fs-6"
                            placeholder="Create a password">
                    </div>
                    <div class="input-group mb-4 d-flex justify-content-between">
                        <div class="form-check mt-3">
                            <input type="checkbox" class="form-check-input " name="" id="formCheck">
                            <label for="formCheck" class="form-check-label text-secondary "><small>I agree to the Terms and Privacy Policy</small></label>
                        </div>
                    </div>

                    <div class="input-group mb-2">
                        <button class="btn btn-lg btn-dark w-100  fs-6">Sign Up</button>
                    </div>
                    <div class="input-group mb-1">
                        <button class="btn btn-lg btn-light w-100  fs-6"><img src="Assets/image/google-removebg-preview.png" class="me-2 img-fluid"
                                style="width: 37px;"><small>Sign in with google</small></button>
                    </div>

                    <div class="input-group mb-1">
                        <button class="btn btn-lg btn-light w-100  fs-6"><img src="Assets/image/facebook-removebg-preview.png" class="me-1 img-fluid"
                                style="width: 30px;"><small>Sign in with google</small></button>
                    </div>

                    <div class="row text-center">
                        <small>Already have an account ? <a href="#" class="text-dark">Login here</a></small>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="Assets/js/bootstrap.bundle.min.js"></script>

</body>

</html>
